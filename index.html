<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Глоссарий</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:var(--tg-theme-bg-color,#0a0a0f);
  --bg2:var(--tg-theme-secondary-bg-color,#111120);
  --text:var(--tg-theme-text-color,#e2e2ee);
  --hint:var(--tg-theme-hint-color,#6060a0);
  --accent:var(--tg-theme-button-color,#7c6fcd);
  --accent-t:var(--tg-theme-button-text-color,#ffffff);
  --link:var(--tg-theme-link-color,#9d8ff0);
  --border:rgba(255,255,255,.07);
  --sans:'Syne',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:0}
input,select,button{font-family:var(--sans)}

.nav{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:30}
.nav-logo{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#3b2fa0);display:flex;align-items:center;justify-content:center;font-size:20px}
.nav-title{font-size:17px;font-weight:700;flex:1;letter-spacing:-.3px}
.nav-settings{background:none;border:none;color:var(--hint);cursor:pointer;display:flex;padding:4px;border-radius:8px}

.stats{display:flex;border-bottom:1px solid var(--border)}
.stat{flex:1;text-align:center;padding:9px 0;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-n{font-size:18px;font-weight:700;color:var(--link)}
.stat-l{font-size:10px;color:var(--hint);margin-top:1px;letter-spacing:.3px}

/* AUTO-ADD BANNER */
.auto-banner{margin:10px 12px 0;background:linear-gradient(135deg,rgba(124,111,205,.15),rgba(61,214,140,.1));border:1px solid rgba(124,111,205,.25);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.auto-banner-text{flex:1}
.auto-banner-title{font-size:13px;font-weight:700;margin-bottom:2px}
.auto-banner-sub{font-size:11px;color:var(--hint);line-height:1.4}
.auto-btn{background:var(--accent);border:none;color:var(--accent-t);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:opacity .15s;flex-shrink:0}
.auto-btn:active{opacity:.8}
.auto-btn:disabled{opacity:.4;cursor:not-allowed}

/* AUTO PROGRESS */
.auto-progress{margin:8px 12px 0;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:none}
.auto-progress.show{display:block}
.auto-progress-title{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.auto-steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hint);transition:color .3s}
.step.active{color:var(--text)}
.step.done{color:#3dd68c}
.step.err{color:#f06060}
.step-icon{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .3s}
.step.active .step-icon{border-color:var(--accent);background:rgba(124,111,205,.15);animation:pulse 1s ease-in-out infinite}
.step.done .step-icon{border-color:#3dd68c;background:rgba(61,214,140,.15)}
.step.err .step-icon{border-color:#f06060;background:rgba(240,96,96,.15)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.prog{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:10px}
.prog-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}

.search-wrap{padding:10px 14px 0;position:sticky;top:56px;background:var(--bg);z-index:20}
.search{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:0 12px;height:42px;transition:border-color .2s}
.search:focus-within{border-color:var(--accent)}
.search svg{color:var(--hint);flex-shrink:0}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
.search input::placeholder{color:var(--hint)}
.clr{background:none;border:none;color:var(--hint);cursor:pointer;display:none;padding:2px}
.clr.show{display:flex}

.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--hint);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}

.list{padding:0 12px 100px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .2s;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.card.open{border-color:var(--accent)}
.card-head{display:flex;align-items:center;gap:9px;padding:12px 13px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cname{flex:1;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ai-pill{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 7px;border-radius:20px;background:rgba(157,143,240,.12);border:1px solid rgba(157,143,240,.22);color:var(--link);font-weight:600}
.cat-pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;flex-shrink:0}
.chev{color:var(--hint);flex-shrink:0;transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.card-body{border-top:1px solid var(--border);padding:11px 13px 13px}
.def{font-size:13px;line-height:1.68;color:var(--hint)}
.en{font-size:11px;color:var(--hint);opacity:.6;margin-top:7px;font-style:italic;font-family:var(--mono)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{background:var(--bg);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--hint);font-family:var(--mono);border:1px solid var(--border)}
.empty{text-align:center;padding:50px 16px;color:var(--hint)}
.empty-ico{font-size:44px;margin-bottom:12px;opacity:.25}

.fab{position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--accent);border:none;color:var(--accent-t);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;z-index:100;box-shadow:0 -2px 16px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0)}
.fab:active{opacity:.85}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(3px)}
.overlay.show{opacity:1;pointer-events:all}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;padding:18px 16px 36px;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(24px);transition:transform .22s}
.overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:34px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.sheet-title svg{color:var(--link)}

.providers{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.provider-btn{display:flex;align-items:center;gap:12px;background:var(--bg2);border:2px solid var(--border);border-radius:13px;padding:12px 14px;cursor:pointer;transition:all .15s;text-align:left}
.provider-btn:active{transform:scale(.98)}
.provider-btn.selected{border-color:var(--accent);background:rgba(124,111,205,.08)}
.provider-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.provider-info{flex:1}
.provider-name{font-size:14px;font-weight:700;margin-bottom:2px}
.provider-desc{font-size:11px;color:var(--hint);line-height:1.4}
.provider-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;flex-shrink:0}
.badge-free{background:rgba(61,214,140,.15);color:#3dd68c;border:1px solid rgba(61,214,140,.25)}
.badge-paid{background:rgba(240,168,50,.12);color:#f0a832;border:1px solid rgba(240,168,50,.22)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.provider-btn.selected .check{background:var(--accent);border-color:var(--accent)}

label{font-size:11px;color:var(--hint);display:block;margin-bottom:6px;margin-top:14px;letter-spacing:.4px;text-transform:uppercase}
.sheet input,.sheet select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.sheet input:focus,.sheet select:focus{border-color:var(--accent)}
.sheet select option{background:var(--bg)}
.key-link{font-size:11px;color:var(--link);margin-top:5px;display:block}

.prog-wrap{margin-top:12px;display:none}
.prog-wrap.show{display:block}
.status{font-size:12px;text-align:center;color:var(--hint)}
.status.ok{color:#3dd68c}.status.err{color:#f06060}

.actions{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px 0;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-sec{background:var(--bg2);border:1px solid var(--border);color:var(--hint)}
.btn-pri{background:var(--accent);color:var(--accent-t);flex:2}
.btn-pri:active{transform:scale(.97)}
.btn-pri:disabled{opacity:.4;cursor:not-allowed}

.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:14px;font-weight:600}
.settings-sub{font-size:11px;color:var(--hint);margin-top:2px}
.danger-btn{width:100%;margin-top:16px;padding:12px;border-radius:12px;border:1px solid rgba(240,96,96,.3);background:rgba(240,96,96,.08);color:#f06060;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">🤖</div>
  <div class="nav-title">AI Глоссарий</div>
  <button class="nav-settings" onclick="openSettings()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">Терминов</div></div>
  <div class="stat"><div class="stat-n" id="sCats">0</div><div class="stat-l">Категорий</div></div>
  <div class="stat"><div class="stat-n" id="sAI">0</div><div class="stat-l">AI-добавлено</div></div>
</div>

<!-- AUTO-ADD BANNER -->
<div class="auto-banner">
  <div class="auto-banner-text">
    <div class="auto-banner-title">✨ Автодобавление</div>
    <div class="auto-banner-sub">AI сам придумает и добавит 3 новых термина</div>
  </div>
  <button class="auto-btn" id="autoBtn" onclick="autoAdd()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
    Добавить 3
  </button>
</div>

<!-- AUTO PROGRESS -->
<div class="auto-progress" id="autoProgress">
  <div class="auto-progress-title">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="color:var(--link)"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
    <span id="autoProgressTitle">Генерирую термины…</span>
  </div>
  <div class="auto-steps" id="autoSteps"></div>
  <div class="prog"><div class="prog-bar" id="autoProgBar" style="width:0%"></div></div>
</div>

<div class="search-wrap">
  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" placeholder="Поиск…" oninput="onSearch(this.value)">
    <button class="clr" id="clrBtn" onclick="clearSearch()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<div class="filters" id="filters"></div>
<div class="list" id="list"></div>

<button class="fab" onclick="openAdd()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Добавить термин вручную
</button>

<!-- ADD SHEET -->
<div class="overlay" id="addOverlay" onclick="onBg(event,'addOverlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
      Добавить термин
    </div>
    <div class="providers" id="providerPicker"></div>
    <label>API-ключ</label>
    <input id="keyInput" type="password" placeholder="Вставьте ключ…">
    <a class="key-link" id="keyLink" href="#" target="_blank">Получить бесплатный ключ →</a>
    <label>Термин</label>
    <input id="termInput" placeholder="Hallucination, LoRA, MoE…">
    <label>Категория</label>
    <select id="catSel">
      <option>Общее</option><option>Архитектуры</option><option>Обучение</option>
      <option>NLP</option><option>Компьютерное зрение</option><option>Агенты</option><option>Инфраструктура</option>
    </select>
    <div class="prog-wrap" id="progWrap">
      <div class="prog"><div class="prog-bar" style="width:0%;transition:none"></div></div>
      <div class="status" id="statusMsg"></div>
    </div>
    <div class="actions">
      <button class="btn btn-sec" onclick="closeAdd()">Отмена</button>
      <button class="btn btn-pri" id="genBtn" onclick="generate()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
        Генерировать
      </button>
    </div>
  </div>
</div>

<!-- SETTINGS SHEET -->
<div class="overlay" id="settingsOverlay" onclick="onBg(event,'settingsOverlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Настройки
    </div>
    <div class="settings-row">
      <div><div class="settings-label">Терминов в глоссарии</div><div class="settings-sub" id="settTermCount"></div></div>
    </div>
    <div class="settings-row">
      <div><div class="settings-label">Провайдер</div><div class="settings-sub" id="settProvider"></div></div>
    </div>
    <div class="settings-row">
      <div><div class="settings-label">Сохранённые ключи</div><div class="settings-sub">Хранятся только локально</div></div>
      <button class="btn btn-sec" style="flex:0;padding:7px 14px;font-size:12px" onclick="clearKeys()">Удалить</button>
    </div>
    <button class="danger-btn" onclick="resetGlossary()">🗑 Сбросить глоссарий</button>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const PROVIDERS=[
  {id:"groq",name:"Groq",icon:"⚡",desc:"Бесплатно · Очень быстрый",badge:"free",link:"https://console.groq.com/keys"},
  {id:"gemini",name:"Google Gemini",icon:"🟦",desc:"Бесплатно · 1500 запросов/день",badge:"free",link:"https://aistudio.google.com/app/apikey"},
  {id:"claude",name:"Claude (Anthropic)",icon:"🟠",desc:"$5 бесплатных кредитов",badge:"paid",link:"https://console.anthropic.com/"},
  {id:"openai",name:"OpenAI GPT-4o",icon:"🟢",desc:"$5 бесплатных кредитов",badge:"paid",link:"https://platform.openai.com/api-keys"},
];

const CATS={
  "Общее":{color:"#9d8ff0",bg:"rgba(157,143,240,.13)"},
  "Архитектуры":{color:"#3dd68c",bg:"rgba(61,214,140,.13)"},
  "Обучение":{color:"#f0a832",bg:"rgba(240,168,50,.13)"},
  "NLP":{color:"#60b4f0",bg:"rgba(96,180,240,.13)"},
  "Компьютерное зрение":{color:"#f06090",bg:"rgba(240,96,144,.13)"},
  "Агенты":{color:"#c86fcd",bg:"rgba(200,111,205,.13)"},
  "Инфраструктура":{color:"#9090a8",bg:"rgba(144,144,168,.13)"},
};

const SEED=[
  {id:1,ru:"Трансформер",en:"Transformer",cat:"Архитектуры",def:"Архитектура нейронных сетей на основе механизма self-attention. Стала основой всех современных LLM — BERT, GPT, Claude.",tags:["attention","seq2seq","GPT"],ai:false},
  {id:2,ru:"Большая языковая модель",en:"Large Language Model (LLM)",cat:"NLP",def:"Нейронная сеть с миллиардами параметров, обученная на огромных корпусах текста для генерации и понимания речи.",tags:["GPT","Claude","параметры"],ai:false},
  {id:3,ru:"Дообучение с обратной связью",en:"RLHF",cat:"Обучение",def:"Метод, при котором человеческие оценки используются для выравнивания поведения модели с предпочтениями пользователей.",tags:["выравнивание","PPO","InstructGPT"],ai:false},
  {id:4,ru:"Векторное встраивание",en:"Embedding",cat:"Общее",def:"Числовое представление объектов в многомерном пространстве, где семантически близкие объекты расположены рядом.",tags:["вектор","семантика","RAG"],ai:false},
  {id:5,ru:"Генерация с расширенным поиском",en:"RAG",cat:"Архитектуры",def:"Подход, сочетающий поиск по базе знаний с генерацией текста для актуальных и точных ответов.",tags:["поиск","векторная БД","контекст"],ai:false},
  {id:6,ru:"Промпт-инжиниринг",en:"Prompt Engineering",cat:"Общее",def:"Искусство формулировки запросов к LLM. Включает chain-of-thought, few-shot и структурированные инструкции.",tags:["few-shot","CoT","инструкции"],ai:false},
];

function load(){try{const s=localStorage.getItem('tg_gl3');return s?JSON.parse(s):null;}catch{return null;}}
function save(){localStorage.setItem('tg_gl3',JSON.stringify({terms,nextId,aiCount}));}
function getKey(pid){return localStorage.getItem('key_'+pid)||'';}
function saveKey(pid,k){localStorage.setItem('key_'+pid,k);}

const saved=load();
let terms=saved?saved.terms:JSON.parse(JSON.stringify(SEED));
let nextId=saved?saved.nextId:SEED.length+1;
let aiCount=saved?saved.aiCount:0;
let filter="Все",openId=null,searchQ="";
let selectedProvider=localStorage.getItem('sel_provider')||'groq';

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── API CALL ──
async function callAI(prompt){
  const apiKey=getKey(selectedProvider);
  if(!apiKey)throw new Error('Нет API-ключа. Добавьте через кнопку «+» внизу.');
  let text='';
  if(selectedProvider==='claude'){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||r.statusText);}
    const d=await r.json();text=d.content.map(i=>i.text||'').join('');
  } else if(selectedProvider==='gemini'){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||r.statusText);}
    const d=await r.json();text=d.candidates?.[0]?.content?.parts?.[0]?.text||'';
  } else if(selectedProvider==='groq'){
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'llama-3.3-70b-versatile',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||r.statusText);}
    const d=await r.json();text=d.choices?.[0]?.message?.content||'';
  } else if(selectedProvider==='openai'){
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'gpt-4o-mini',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||r.statusText);}
    const d=await r.json();text=d.choices?.[0]?.message?.content||'';
  }
  return text;
}

// ── AUTO ADD ──
async function autoAdd(){
  if(!getKey(selectedProvider)){
    // no key — open add sheet to prompt user
    openAdd();
    return;
  }
  const btn=$('autoBtn');
  btn.disabled=true;
  const prog=$('autoProgress');
  prog.classList.add('show');
  $('autoProgBar').style.width='5%';

  // build existing terms list to avoid duplicates
  const existing=terms.map(t=>t.ru).join(', ');
  const cats=Object.keys(CATS);

  // step UI helpers
  const stepsEl=$('autoSteps');
  const stepIds=['step1','step2','step3'];
  const stepNames=['Термин 1','Термин 2','Термин 3'];
  stepsEl.innerHTML=stepNames.map((n,i)=>
    `<div class="step" id="${stepIds[i]}">
      <div class="step-icon" id="${stepIds[i]}_icon">·</div>
      <span id="${stepIds[i]}_label">${n}: ожидание…</span>
    </div>`
  ).join('');

  function setStep(i,state,label){
    const el=$(`step${i+1}`);
    const ico=$(`step${i+1}_icon`);
    const lbl=$(`step${i+1}_label`);
    el.className='step '+state;
    ico.textContent=state==='done'?'✓':state==='err'?'✗':state==='active'?'…':'·';
    lbl.textContent=label;
  }

  $('autoProgressTitle').textContent='Генерирую термины…';

  // ask AI for 3 terms at once
  const prompt=`Ты пополняешь AI-глоссарий на русском языке.
Уже есть термины: ${existing}.
Придумай 3 НОВЫХ интересных AI-термина которых ещё НЕТ в списке выше.
Для каждого выбери одну категорию из: ${cats.join(', ')}.

Ответь ТОЛЬКО валидным JSON-массивом без markdown:
[
  {"ru":"название","en":"English name","cat":"Категория","def":"определение 1-3 предложения","tags":["тег1","тег2","тег3"]},
  {"ru":"...","en":"...","cat":"...","def":"...","tags":[...]},
  {"ru":"...","en":"...","cat":"...","def":"...","tags":[...]}
]`;

  try{
    // mark all as active
    for(let i=0;i<3;i++) setStep(i,'active',stepNames[i]+': генерирую…');
    $('autoProgBar').style.width='30%';

    const text=await callAI(prompt);
    $('autoProgBar').style.width='70%';

    const clean=text.replace(/```json|```/g,'').trim();
    const arr=JSON.parse(clean);

    let added=0;
    for(let i=0;i<Math.min(arr.length,3);i++){
      const p=arr[i];
      if(!p.ru)continue;
      // check duplicate
      const dup=terms.some(t=>t.ru.toLowerCase()===p.ru.toLowerCase());
      if(dup){setStep(i,'err',`${p.ru}: уже есть`);continue;}
      const cat=Object.keys(CATS).includes(p.cat)?p.cat:'Общее';
      terms.unshift({id:nextId++,ru:p.ru,en:p.en||'',cat,def:p.def||'',tags:Array.isArray(p.tags)?p.tags:[],ai:true});
      aiCount++;added++;
      setStep(i,'done',`${p.ru} ✓`);
      $('autoProgBar').style.width=(70+added*10)+'%';
      // small delay for visual effect
      await new Promise(r=>setTimeout(r,300));
      stats();renderFilters();renderList();
    }

    save();
    $('autoProgBar').style.width='100%';
    $('autoProgressTitle').textContent=`✓ Добавлено ${added} из 3 терминов`;
    tg?.HapticFeedback?.notificationOccurred('success');
    setTimeout(()=>{prog.classList.remove('show');$('autoProgBar').style.width='0%';},3000);
  }catch(e){
    $('autoProgressTitle').textContent='Ошибка: '+e.message;
    for(let i=0;i<3;i++) setStep(i,'err','Ошибка');
    tg?.HapticFeedback?.notificationOccurred('error');
    setTimeout(()=>{prog.classList.remove('show');},4000);
  }
  btn.disabled=false;
}

// ── PROVIDERS ──
function renderProviders(){
  $('providerPicker').innerHTML=PROVIDERS.map(p=>`
    <button class="provider-btn${p.id===selectedProvider?' selected':''}" onclick="selectProvider('${p.id}')">
      <div class="provider-icon">${p.icon}</div>
      <div class="provider-info">
        <div class="provider-name">${p.name}</div>
        <div class="provider-desc">${p.desc}</div>
      </div>
      <span class="provider-badge badge-${p.badge}">${p.badge==='free'?'Бесплатно':'Платный'}</span>
      <div class="check">${p.id===selectedProvider?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</div>
    </button>`
  ).join('');
  updateKeyHint();
}
function selectProvider(id){selectedProvider=id;localStorage.setItem('sel_provider',id);$('keyInput').value=getKey(id);renderProviders();}
function updateKeyHint(){const p=PROVIDERS.find(x=>x.id===selectedProvider);$('keyLink').href=p.link;$('keyLink').textContent='Получить ключ на '+p.name+' →';}

// ── STATS / FILTERS / LIST ──
function stats(){$('sTotal').textContent=terms.length;$('sCats').textContent=new Set(terms.map(t=>t.cat)).size;$('sAI').textContent=aiCount;}
function renderFilters(){
  $('filters').innerHTML=["Все",...new Set(terms.map(t=>t.cat))].map(c=>
    `<button class="chip${c===filter?' on':''}" onclick="setFilter(${JSON.stringify(c)})">${c}</button>`
  ).join('');
}
function setFilter(c){filter=c;renderFilters();renderList();}
function visible(){
  return terms.filter(t=>{
    const mc=filter==="Все"||t.cat===filter;
    const q=searchQ.toLowerCase();
    return mc&&(!q||(t.ru.toLowerCase().includes(q)||t.en.toLowerCase().includes(q)||t.def.toLowerCase().includes(q)));
  });
}
function renderList(){
  const data=visible();
  if(!data.length){$('list').innerHTML=`<div class="empty"><div class="empty-ico">🔍</div><p>Ничего не найдено</p></div>`;return;}
  $('list').innerHTML=data.map(t=>{
    const c=CATS[t.cat]||CATS['Общее'];
    const isOpen=openId===t.id;
    return`<div class="card${isOpen?' open':''}" onclick="toggle(${t.id})">
      <div class="card-head">
        <div class="dot" style="background:${c.color}"></div>
        <div class="cname">${esc(t.ru)}${t.ai?`<span class="ai-pill">✦ AI</span>`:''}</div>
        <span class="cat-pill" style="background:${c.bg};color:${c.color}">${esc(t.cat)}</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      ${isOpen?`<div class="card-body">
        <p class="def">${esc(t.def)}</p>
        ${t.en?`<p class="en">EN: ${esc(t.en)}</p>`:''}
        ${t.tags.length?`<div class="tags">${t.tags.map(tg=>`<span class="tag">${esc(tg)}</span>`).join('')}</div>`:''}
      </div>`:''}
    </div>`;
  }).join('');
}
function toggle(id){openId=openId===id?null:id;tg?.HapticFeedback?.impactOccurred('light');renderList();}
function onSearch(v){searchQ=v;$('clrBtn').classList.toggle('show',!!v);renderList();}
function clearSearch(){$('searchInput').value='';onSearch('');}

// ── SHEETS ──
function openAdd(){renderProviders();$('keyInput').value=getKey(selectedProvider);$('addOverlay').classList.add('show');setTimeout(()=>$('termInput').focus(),120);tg?.HapticFeedback?.impactOccurred('medium');}
function closeAdd(){$('addOverlay').classList.remove('show');$('termInput').value='';$('progWrap').classList.remove('show');$('genBtn').disabled=false;$('statusMsg').textContent='';}
function openSettings(){$('settTermCount').textContent=terms.length+' терминов';$('settProvider').textContent=PROVIDERS.find(p=>p.id===selectedProvider)?.name||selectedProvider;$('settingsOverlay').classList.add('show');}
function closeSettings(){$('settingsOverlay').classList.remove('show');}
function onBg(e,id){if(e.target===$(id))id==='addOverlay'?closeAdd():closeSettings();}
function clearKeys(){PROVIDERS.forEach(p=>localStorage.removeItem('key_'+p.id));tg?.HapticFeedback?.notificationOccurred('success');closeSettings();}
function resetGlossary(){if(!confirm('Сбросить глоссарий?'))return;terms=JSON.parse(JSON.stringify(SEED));nextId=SEED.length+1;aiCount=0;save();stats();renderFilters();renderList();closeSettings();}

$('termInput').addEventListener('keydown',e=>{if(e.key==='Enter')generate();});

// ── MANUAL GENERATE ──
async function generate(){
  const term=$('termInput').value.trim();
  if(!term)return;
  const k=$('keyInput').value.trim();
  if(k)saveKey(selectedProvider,k);
  if(!getKey(selectedProvider)){setStatus('Введите API-ключ выше','err');$('progWrap').classList.add('show');return;}
  const cat=$('catSel').value;
  $('genBtn').disabled=true;
  $('progWrap').classList.add('show');
  setStatus('Генерирую…','');
  try{
    const prompt=`AI-глоссарий на русском. Термин: "${term}", категория: "${cat}".
Только JSON без markdown:
{"ru":"название на русском","en":"English name","def":"определение 1-3 предложения","tags":["тег1","тег2","тег3"]}`;
    const text=await callAI(prompt);
    const p=JSON.parse(text.replace(/```json|```/g,'').trim());
    terms.unshift({id:nextId++,ru:p.ru||term,en:p.en||'',cat,def:p.def||'',tags:Array.isArray(p.tags)?p.tags:[],ai:true});
    aiCount++;save();
    setStatus('✓ Добавлено!','ok');
    tg?.HapticFeedback?.notificationOccurred('success');
    stats();renderFilters();renderList();
    setTimeout(closeAdd,900);
  }catch(e){
    setStatus('Ошибка: '+e.message,'err');
    tg?.HapticFeedback?.notificationOccurred('error');
    $('genBtn').disabled=false;
  }
}
function setStatus(msg,cls){const el=$('statusMsg');el.textContent=msg;el.className='status'+(cls?' '+cls:'');}

stats();renderFilters();renderList();
</script>
